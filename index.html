<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bella Bay - Coiffure & Beauté</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #121212;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background-color: #fcf9f6;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        /* En-tête */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 20px;
            background-color: #fff;
            border-bottom: 1px solid #f0f0f0;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-badge {
            background-color: #1c1512;
            color: #d4af37;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
        }

        .brand-name {
            font-family: serif;
            font-size: 20px;
            letter-spacing: 1px;
            color: #1c1512;
        }

        .menu-icon {
            font-size: 24px;
            cursor: pointer;
        }

        /* Première section (Haut de page) */
        .top-section {
            padding: 25px 20px;
            text-align: center;
            background-color: #fff;
            border-bottom: 1px solid #f0f0f0;
        }

        .btn-collection {
            display: block;
            width: 100%;
            background-color: #1c1512;
            color: #ffffff;
            text-align: center;
            padding: 14px 0;
            font-size: 12px;
            letter-spacing: 1.5px;
            text-decoration: none;
            text-transform: uppercase;
            font-weight: bold;
            border-radius: 2px;
        }

        /* Section Produit / Carte (Modifiée) */
        .card {
            padding: 20px;
            background-color: #fff;
            margin-bottom: 10px;
        }

        .image-wrapper {
            position: relative;
            width: 100%;
            border-radius: 8px;
            overflow: hidden;
        }

        .image-wrapper img {
            width: 100%;
            height: auto;
            display: block;
        }

        .badge-essentiel {
            position: absolute;
            top: 15px;
            left: 15px;
            background-color: #1c1512;
            color: #ffffff;
            font-size: 11px;
            letter-spacing: 1.5px;
            padding: 6px 12px;
            text-transform: uppercase;
            font-weight: 500;
        }

        .card-content {
            padding: 20px 0;
            text-align: left;
        }

        .card-title {
            font-family: serif;
            font-size: 24px;
            color: #1c1512;
            margin-bottom: 10px;
            font-weight: normal;
        }

        .card-description {
            font-size: 13px;
            color: #666;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .promo-box {
            border: 1px dashed #d4af37;
            background-color: #fdfbf7;
            padding: 12px;
            text-align: center;
            font-size: 13px;
            color: #444;
            border-radius: 4px;
            margin-bottom: 20px;
        }

        .promo-box strong {
            color: #8c5830;
        }

        .btn-acheter {
            display: block;
            width: 100%;
            background-color: #1c1512;
            color: #ffffff;
            text-align: center;
            padding: 14px 0;
            font-size: 12px;
            letter-spacing: 1.5px;
            text-decoration: none;
            text-transform: uppercase;
            font-weight: bold;
            border-radius: 2px;
        }

        /* Section inférieure visible en bas de capture */
        .bottom-section {
            background-color: #fff;
            padding: 15px;
            text-align: center;
        }

        .bottom-section img {
            width: 100%;
            height: auto;
            border-radius: 4px;
            display: block;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Barre de navigation -->
        <div class="header">
            <div class="logo-container">
                <div class="logo-badge">B.B</div>
                <div class="brand-name">Bella Bay</div>
            </div>
            <div class="menu-icon">&#9776;</div>
        </div>

        <!-- Section supérieure (Bouton Collection) -->
        <div class="top-section">
            <a href="#" class="btn-collection">Acheter la collection</a>
        </div>

        <!-- Section centrale (Carte modifiée : Nuancier + Badge ESSENTIEL + Textes + Bouton) -->
        <div class="card">
            <div class="image-wrapper">
                <!-- Image du nuancier de vernis à la place de l'homme à lunettes -->
                <img src="URL_DE_VOTRE_IMAGE_NUANCIER" alt="Kits & Accessoires Pro">
                <div class="badge-essentiel">Essentiel</div>
            </div>

            <div class="card-content">
                <h2 class="card-title">Kits & Accessoires Pro</h2>
                <p class="card-description">
                    Tout le nécessaire de qualité professionnelle pour une pose facile, propre et durable à la maison.
                </p>

                <div class="promo-box">
                    Rabais 10% : <strong>BELLA</strong>
                </div>

                <a href="#" class="btn-acheter">Acheter les accessoires</a>
            </div>
        </div>

        <!-- Section inférieure (Aperçu salon/bureau) -->
        <div class="bottom-section">
            <img src="URL_DE_VOTRE_IMAGE_SALON" alt="Salon Bella Bay">
        </div>
    </div>

</body>
</html>
