<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bella Bay | Coiffure & Beauté — Montréal, Laval & Rive-Nord</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

/* =========================================================
   BELLA BAY — IDENTITÉ VISUELLE
========================================================= */

:root{
    --black:#090708;
    --black-soft:#141011;
    --pink:#f6dce3;
    --pink-soft:#fff4f6;
    --rose:#d99aaa;
    --rose-dark:#a96779;
    --gold:#c9a45c;
    --gold-light:#e5ca91;
    --white:#fff;
    --cream:#fffaf8;
    --text:#292124;
    --gray:#81777a;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:'Montserrat',sans-serif;
    color:var(--text);
    background:var(--cream);
    overflow-x:hidden;
}

img{
    width:100%;
    display:block;
}

a{
    text-decoration:none;
    color:inherit;
}

button{
    font-family:inherit;
}

h1,h2,h3,h4{
    font-family:'Cormorant Garamond',serif;
}

/* =========================================================
   BARRE DU HAUT
========================================================= */

.top-bar{
    background:#000;
    color:#eee;
    text-align:center;
    padding:8px 15px;
    font-size:11px;
    letter-spacing:2px;
    text-transform:uppercase;
}

/* =========================================================
   NAVIGATION
========================================================= */

header{
    position:sticky;
    top:0;
    z-index:1000;
    background:rgba(9,7,8,.96);
    backdrop-filter:blur(15px);
    border-bottom:1px solid rgba(229,202,145,.25);
}

.navbar{
    max-width:1400px;
    margin:auto;
    min-height:82px;
    padding:0 5%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:30px;
}

.logo{
    display:flex;
    align-items:center;
    gap:12px;
}

.logo-circle{
    width:48px;
    height:48px;
    border:1px solid var(--gold);
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--gold-light);
    font-family:'Cormorant Garamond',serif;
    font-size:20px;
    font-weight:600;
    box-shadow:0 0 18px rgba(201,164,92,.15);
}

.logo-text{
    color:#fff;
    font-family:'Cormorant Garamond',serif;
    font-size:25px;
    letter-spacing:1px;
}

.logo-text span{
    color:var(--rose);
}

nav{
    display:flex;
    gap:25px;
    align-items:center;
}

nav a{
    color:#eee;
    font-size:12px;
    letter-spacing:1px;
    transition:.3s;
}

nav a:hover{
    color:var(--rose);
}

.nav-button{
    background:linear-gradient(135deg,var(--gold-light),var(--gold));
    color:#171113;
    padding:12px 22px;
    border-radius:30px;
    font-size:11px;
    font-weight:700;
    letter-spacing:1px;
    text-transform:uppercase;
}

.menu{
    display:none;
    color:white;
    font-size:25px;
    cursor:pointer;
}

/* =========================================================
   HERO
========================================================= */

.hero{
    min-height:88vh;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    color:white;
    background:
        linear-gradient(rgba(12,8,10,.30),rgba(12,8,10,.65)),
        url("https://images.unsplash.com/photo-1522337360788-8b13dee7a37e?auto=format&fit=crop&w=2200&q=90")
        center/cover;
}

.hero::after{
    content:"";
    position:absolute;
    inset:0;
    background:radial-gradient(circle at center,transparent 25%,rgba(0,0,0,.35));
}

.hero-content{
    position:relative;
    z-index:2;
    max-width:850px;
    padding:30px;
}

.hero-small{
    color:var(--gold-light);
    letter-spacing:5px;
    font-size:12px;
    text-transform:uppercase;
    margin-bottom:18px;
}

.hero h1{
    font-size:clamp(55px,9vw,105px);
    line-height:.85;
    font-weight:500;
    letter-spacing:3px;
}

.hero h1 span{
    color:var(--pink);
}

.hero p{
    margin:30px auto;
    max-width:650px;
    font-size:16px;
    line-height:1.9;
    font-weight:300;
}

.buttons{
    display:flex;
    justify-content:center;
    gap:15px;
    flex-wrap:wrap;
}

.btn{
    padding:15px 28px;
    border-radius:30px;
    font-size:11px;
    font-weight:700;
    letter-spacing:1.5px;
    text-transform:uppercase;
    transition:.3s;
}

.btn-gold{
    background:linear-gradient(135deg,var(--gold-light),var(--gold));
    color:#171113;
}

.btn-pink{
    background:var(--pink);
    color:#24171a;
}

.btn-outline{
    border:1px solid rgba(255,255,255,.8);
    color:white;
}

.btn:hover{
    transform:translateY(-3px);
}

/* =========================================================
   INTRO
========================================================= */

.intro{
    background:var(--pink-soft);
    padding:90px 8%;
    text-align:center;
}

.intro-inner{
    max-width:850px;
    margin:auto;
}

.eyebrow{
    color:var(--rose-dark);
    font-size:11px;
    letter-spacing:4px;
    text-transform:uppercase;
    margin-bottom:15px;
}

.intro h2{
    font-size:52px;
    font-weight:500;
    margin-bottom:20px;
}

.intro h2 span{
    color:var(--rose-dark);
}

.intro p{
    color:#665b5f;
    font-size:15px;
    line-height:2;
}

/* =========================================================
   SERVICES
========================================================= */

.services{
    padding:100px 6%;
    background:white;
}

.section-heading{
    text-align:center;
    max-width:750px;
    margin:0 auto 55px;
}

.section-heading h2{
    font-size:55px;
    font-weight:500;
}

.section-heading h2 span{
    color:var(--rose-dark);
}

.section-heading p{
    color:var(--gray);
    font-size:14px;
    line-height:1.8;
    margin-top:12px;
}

.services-grid{
    max-width:1300px;
    margin:auto;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:22px;
}

.service-card{
    position:relative;
    min-height:410px;
    overflow:hidden;
    background:#111;
    border-radius:4px;
}

.service-card img{
    height:100%;
    object-fit:cover;
    transition:transform .7s;
}

.service-card:hover img{
    transform:scale(1.06);
}

.service-overlay{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    justify-content:flex-end;
    padding:28px;
    color:white;
    background:linear-gradient(transparent 25%,rgba(0,0,0,.88));
}

.service-number{
    color:var(--gold-light);
    font-size:11px;
    letter-spacing:3px;
    margin-bottom:8px;
}

.service-overlay h3{
    font-size:31px;
    font-weight:500;
}

.service-overlay p{
    font-size:12px;
    line-height:1.6;
    color:#eee;
    margin:8px 0 15px;
}

.service-link{
    color:var(--pink);
    font-size:10px;
    letter-spacing:2px;
    text-transform:uppercase;
}

/* =========================================================
   BANDEAU ROSE
========================================================= */

.pink-banner{
    background:
        linear-gradient(rgba(218,154,170,.90),rgba(218,154,170,.90)),
        url("https://images.unsplash.com/photo-1595476108010-b4d1f102b1b1?auto=format&fit=crop&w=1800&q=80")
        center/cover;
    padding:80px 8%;
    text-align:center;
    color:white;
}

.pink-banner h2{
    font-size:55px;
    font-weight:500;
}

.pink-banner p{
    max-width:700px;
    margin:15px auto 25px;
    line-height:1.8;
    font-size:14px;
}

/* =========================================================
   SERVICE MOBILE / CARTE
========================================================= */

.mobile-section{
    padding:100px 7%;
    background:var(--black);
    color:white;
}

.mobile-grid{
    max-width:1250px;
    margin:auto;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:60px;
    align-items:center;
}

.mobile-photo{
    height:570px;
    overflow:hidden;
    border:1px solid rgba(229,202,145,.4);
}

.mobile-photo img{
    height:100%;
    object-fit:cover;
}

.mobile-content .eyebrow{
    color:var(--gold-light);
}

.mobile-content h2{
    font-size:57px;
    font-weight:500;
    line-height:1;
    margin-bottom:25px;
}

.mobile-content h2 span{
    color:var(--pink);
}

.mobile-content p{
    color:#ccc;
    font-size:14px;
    line-height:2;
    margin-bottom:20px;
}

.area-list{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin:25px 0;
}

.area{
    border:1px solid rgba(229,202,145,.5);
    padding:10px 15px;
    color:var(--pink);
    font-size:11px;
    letter-spacing:1px;
}

/* =========================================================
   ZONE / CARTE STYLE GOOGLE MAPS
========================================================= */

.location{
    padding:100px 7%;
    background:#f8e8ec;
}

.map-layout{
    max-width:1250px;
    margin:auto;
    display:grid;
    grid-template-columns:380px 1fr;
    min-height:520px;
    background:white;
    box-shadow:0 20px 60px rgba(60,30,40,.12);
}

.location-info{
    padding:50px 40px;
}

.location-info h2{
    font-size:48px;
    line-height:1;
    font-weight:500;
    margin-bottom:20px;
}

.location-info h2 span{
    color:var(--rose-dark);
}

.location-info p{
    color:#756b6e;
    font-size:13px;
    line-height:1.8;
}

.location-list{
    margin-top:30px;
}

.location-list div{
    padding:15px 0;
    border-bottom:1px solid #eee;
    font-size:12px;
}

.location-list strong{
    display:block;
    font-family:'Cormorant Garamond',serif;
    font-size:22px;
    color:#302529;
}

.map{
    position:relative;
    min-height:520px;
    overflow:hidden;
    background:
        linear-gradient(35deg,transparent 48%,rgba(255,255,255,.8) 49%,rgba(255,255,255,.8) 52%,transparent 53%),
        linear-gradient(-25deg,transparent 48%,rgba(255,255,255,.75) 49%,rgba(255,255,255,.75) 52%,transparent 53%),
        #eadfd7;
}

.map::before{
    content:"";
    position:absolute;
    inset:10%;
    border:55px solid transparent;
    border-top-color:rgba(190,215,207,.65);
    border-radius:50%;
    transform:rotate(-20deg);
}

.map-road{
    position:absolute;
    background:#fff;
    height:10px;
    width:120%;
    left:-10%;
    top:48%;
    transform:rotate(-10deg);
    box-shadow:0 1px 4px rgba(0,0,0,.1);
}

.map-road.two{
    top:63%;
    transform:rotate(22deg);
}

.pin{
    position:absolute;
    left:50%;
    top:45%;
    transform:translate(-50%,-50%);
    width:52px;
    height:52px;
    border-radius:50% 50% 50% 0;
    background:var(--rose-dark);
    transform-origin:center;
    rotate:-45deg;
    box-shadow:0 8px 20px rgba(100,50,65,.3);
}

.pin::after{
    content:"BB";
    position:absolute;
    inset:10px;
    background:white;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--rose-dark);
    font-weight:bold;
    font-size:11px;
    rotate:45deg;
}

.map-label{
    position:absolute;
    background:white;
    padding:10px 15px;
    box-shadow:0 3px 15px rgba(0,0,0,.1);
    font-size:11px;
    border-radius:4px;
}

.label-mtl{top:25%;left:25%}
.label-laval{top:18%;right:20%}
.label-rn{bottom:18%;right:25%}

/* =========================================================
   BOUTIQUE
========================================================= */

.shop{
    padding:100px 7%;
    background:var(--black);
    color:white;
}

.shop .section-heading h2{
    color:white;
}

.shop .section-heading p{
    color:#aaa;
}

.products{
    max-width:1250px;
    margin:auto;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:25px;
}

.product{
    background:#171214;
    border:1px solid rgba(229,202,145,.22);
    overflow:hidden;
}

.product-img{
    height:330px;
    overflow:hidden;
    background:#241b1e;
}

.product-img img{
    height:100%;
    object-fit:cover;
    transition:.6s;
}

.product:hover img{
    transform:scale(1.05);
}

.product-info{
    padding:25px;
}

.product-info small{
    color:var(--gold-light);
    letter-spacing:2px;
    text-transform:uppercase;
    font-size:9px;
}

.product-info h3{
    font-size:30px;
    margin:6px 0;
    font-weight:500;
}

.product-info p{
    color:#aaa;
    font-size:12px;
    line-height:1.7;
}

.product-button{
    display:inline-block;
    margin-top:18px;
    border:1px solid var(--rose);
    color:var(--pink);
    padding:10px 17px;
    font-size:10px;
    letter-spacing:1.5px;
    text-transform:uppercase;
}

/* =========================================================
   HISTOIRE
========================================================= */

.story{
    padding:100px 7%;
    background:var(--pink-soft);
}

.story-grid{
    max-width:1200px;
    margin:auto;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:60px;
    align-items:center;
}

.story-image{
    height:570px;
    overflow:hidden;
}

.story-image img{
    height:100%;
    object-fit:cover;
}

.story-content h2{
    font-size:58px;
    line-height:1;
    font-weight:500;
    margin-bottom:25px;
}

.story-content h2 span{
    color:var(--rose-dark);
}

.story-content p{
    color:#655b5e;
    font-size:14px;
    line-height:2;
    margin-bottom:18px;
}

.values{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
    margin-top:30px;
}

.value{
    padding:18px;
    border:1px solid #e3c4cb;
    background:white;
}

.value strong{
    display:block;
    color:var(--rose-dark);
    font-family:'Cormorant Garamond',serif;
    font-size:22px;
}

/* =========================================================
   FUTUR SALON
========================================================= */

.future{
    padding:100px 7%;
    background:white;
    text-align:center;
}

.future-box{
    max-width:1000px;
    margin:auto;
    border:1px solid var(--gold);
    padding:70px 40px;
    position:relative;
}

.future-box::before,
.future-box::after{
    content:"✦";
    position:absolute;
    color:var(--gold);
    font-size:24px;
}

.future-box::before{
    top:20px;
    left:25px;
}

.future-box::after{
    bottom:20px;
    right:25px;
}

.future h2{
    font-size:58px;
    font-weight:500;
}

.future h2 span{
    color:var(--rose-dark);
}

.future p{
    max-width:700px;
    margin:20px auto 30px;
    color:#71676a;
    line-height:1.9;
    font-size:14px;
}

/* =========================================================
   AVIS
========================================================= */

.reviews{
    padding:100px 7%;
    background:#f2d9df;
}

.review-grid{
    max-width:1100px;
    margin:auto;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
}

.review{
    background:white;
    padding:35px 28px;
    text-align:center;
}

.stars{
    color:var(--gold);
    letter-spacing:3px;
    margin-bottom:15px;
}

.review p{
    color:#62585b;
    font-size:13px;
    line-height:1.8;
    font-style:italic;
}

.review strong{
    display:block;
    margin-top:20px;
    font-family:'Cormorant Garamond',serif;
    font-size:22px;
}

/* =========================================================
   CTA
========================================================= */

.cta{
    padding:100px 20px;
    background:
        linear-gradient(rgba(8,6,7,.72),rgba(8,6,7,.85)),
        url("https://images.unsplash.com/photo-1522338242992-e1a54906a8da?auto=format&fit=crop&w=2000&q=90")
        center/cover;
    text-align:center;
    color:white;
}

.cta h2{
    font-size:65px;
    font-weight:500;
}

.cta h2 span{
    color:var(--pink);
}

.cta p{
    max-width:650px;
    margin:15px auto 30px;
    color:#ddd;
    font-size:14px;
    line-height:1.8;
}

/* =========================================================
   FOOTER
========================================================= */

footer{
    background:#050405;
    color:white;
    padding:65px 7% 25px;
}

.footer-grid{
    max-width:1250px;
    margin:auto;
    display:grid;
    grid-template-columns:2fr 1fr 1fr 1fr;
    gap:45px;
}

.footer-brand h3{
    font-size:35px;
    font-weight:500;
}

.footer-brand h3 span{
    color:var(--rose);
}

.footer-brand p{
    color:#999;
    font-size:12px;
    line-height:1.8;
    max-width:350px;
    margin-top:12px;
}

footer h4{
    color:var(--gold-light);
    font-family:'Montserrat',sans-serif;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:2px;
    margin-bottom:18px;
}

footer a,
footer p{
    display:block;
    color:#999;
    font-size:12px;
    margin-bottom:10px;
}

.footer-bottom{
    max-width:1250px;
    margin:50px auto 0;
    padding-top:20px;
    border-top:1px solid rgba(255,255,255,.08);
    text-align:center;
    color:#666;
    font-size:10px;
}

/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:950px){

    nav{
        display:none;
    }

    .menu{
        display:block;
    }

    .navbar{
        min-height:70px;
    }

    .services-grid{
        grid-template-columns:repeat(2,1fr);
    }

    .mobile-grid,
    .story-grid{
        grid-template-columns:1fr;
    }

    .mobile-photo,
    .story-image{
        height:450px;
    }

    .map-layout{
        grid-template-columns:1fr;
    }

    .products{
        grid-template-columns:repeat(2,1fr);
    }

    .review-grid{
        grid-template-columns:1fr;
    }

    .footer-grid{
        grid-template-columns:repeat(2,1fr);
    }
}

@media(max-width:600px){

    .top-bar{
        font-size:8px;
        letter-spacing:1px;
    }

    .logo-text{
        font-size:21px;
    }

    .logo-circle{
        width:40px;
        height:40px;
    }

    .nav
