<!DOCTYPE html>
<html lang="fr-CA">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#171313">

  <meta name="description" content="Bella Bay (B.B) — Coiffure mobile à domicile à Montréal, Laval et sur la Rive-Nord. Découvrez nos services professionnels et notre boutique beauté.">

  <title>Bella Bay (B.B) — Coiffure & Beauté</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --black: #171313;
      --black-soft: #211a1b;
      --rose: #d9a0a5;
      --rose-light: #f4dfe0;
      --rose-pale: #fff7f6;
      --gold: #c9a46b;
      --gold-light: #e5c99a;
      --white: #fffdfc;
      --text: #382e2e;
      --muted: #827474;
      --border: rgba(201, 164, 107, 0.35);
      --shadow: 0 14px 38px rgba(33, 20, 20, 0.09);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: 100px;
    }

    body {
      background: var(--white);
      color: var(--text);
      font-family: 'Montserrat', sans-serif;
      font-size: 14px;
      line-height: 1.7;
    }

    img {
      display: block;
      width: 100%;
      max-width: 100%;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font: inherit;
    }

    button,
    a {
      -webkit-tap-highlight-color: transparent;
    }

    .container {
      width: min(1160px, 90%);
      margin: 0 auto;
    }

    .section {
      padding: 88px 0;
    }

    .section-heading {
      text-align: center;
      max-width: 720px;
      margin: 0 auto 42px;
    }

    .eyebrow {
      display: inline-block;
      color: #a77b45;
      text-transform: uppercase;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 3px;
      margin-bottom: 12px;
    }

    h1,
    h2,
    h3,
    .brand-name {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 500;
      line-height: 1.12;
    }

    h2 {
      font-size: clamp(35px, 4.5vw, 52px);
      color: var(--black);
      margin-bottom: 16px;
    }

    .section-heading p {
      color: var(--muted);
      font-size: 13px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 47px;
      padding: 12px 23px;
      border: 1px solid var(--gold);
      background: var(--gold);
      color: var(--black);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.3px;
      text-transform: uppercase;
      transition: 0.25s ease;
      cursor: pointer;
      text-align: center;
    }

    .btn:hover {
      background: var(--gold-light);
      border-color: var(--gold-light);
      transform: translateY(-2px);
    }

    .btn-outline {
      background: transparent;
      border-color: var(--gold-light);
      color: var(--gold-light);
    }

    .btn-outline:hover {
      background: var(--gold);
      color: var(--black);
    }

    .btn-dark {
      background: var(--black);
      color: var(--white);
      border-color: var(--black);
    }

    .btn-dark:hover {
      background: #34292a;
      color: var(--white);
    }

    /* BARRE D'ANNONCE */

    .announcement {
      background: var(--black);
      color: var(--rose-light);
      text-align: center;
      padding: 9px 15px;
      font-size: 9px;
      letter-spacing: 1.8px;
      text-transform: uppercase;
    }

    .announcement span {
      color: var(--gold-light);
      font-weight: 700;
    }

    /* EN-TÊTE ET MENU */

    .site-header {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(255, 253, 252, 0.97);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(12px);
    }

    .header-inner {
      min-height: 88px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    .brand-mark {
      width: 54px;
      height: 54px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--gold);
      border-radius: 50%;
      color: var(--gold);
      background: var(--black);
      font-family: 'Cormorant Garamond', serif;
      font-size: 21px;
      letter-spacing: 1px;
    }

    .brand-copy {
      display: flex;
      flex-direction: column;
    }

    .brand-name {
      color: var(--black);
      font-size: 30px;
      letter-spacing: 1px;
    }

    .brand-tagline {
      color: #a77b45;
      font-size: 8px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .main-nav {
      display: flex;
      align-items: center;
      gap: 21px;
    }

    .main-nav > a,
    .dropdown-toggle {
      border: 0;
      background: transparent;
      color: var(--text);
      font-family: 'Montserrat', sans-serif;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.7px;
      cursor: pointer;
      white-space: nowrap;
      transition: color 0.2s ease;
    }

    .main-nav > a:hover,
    .dropdown-toggle:hover {
      color: #a77b45;
    }

    .main-nav .nav-book {
      padding: 11px 14px;
      background: var(--black);
      color: var(--gold-light);
      border: 1px solid var(--gold);
    }

    .main-nav .nav-book:hover {
      background: var(--gold);
      color: var(--black);
    }

    .dropdown {
      position: relative;
    }

    .dropdown-toggle {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .dropdown-menu {
      display: none;
      position: absolute;
      top: calc(100% + 16px);
      left: -18px;
      min-width: 230px;
      padding: 9px;
      background: var(--white);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
    }

    .dropdown.open .dropdown-menu {
      display: block;
    }

    .dropdown-menu a {
      display: block;
      padding: 10px 12px;
      color: var(--text);
      font-size: 11px;
      border-bottom: 1px solid #f2e9e6;
    }

    .dropdown-menu a:last-child {
      border-bottom: 0;
    }

    .dropdown-menu a:hover {
      background: var(--rose-pale);
      color: #9b6b36;
    }

    .mobile-menu-toggle {
      display: none;
      width: 44px;
      height: 44px;
      border: 1px solid var(--border);
      background: var(--white);
      color: var(--black);
      font-size: 23px;
      cursor: pointer;
    }

    /* ACCUEIL */

    .hero {
      position: relative;
      min-height: 610px;
      display: flex;
      align-items: center;
      overflow: hidden;
      background:
        linear-gradient(
          90deg,
          rgba(23, 19, 19, 0.88) 0%,
          rgba(23, 19, 19, 0.62) 48%,
          rgba(23, 19, 19, 0.16) 100%
        ),
        url('https://images.unsplash.com/photo-1522337360788-8b13dee7a37e?auto=format&fit=crop&w=2000&q=85')
        center 38% / cover no-repeat;
    }

    .hero-content {
      position: relative;
      z-index: 1;
      max-width: 720px;
      padding: 85px 0;
      color: var(--white);
    }

    .hero .eyebrow {
      color: var(--gold-light);
    }

    .hero h1 {
      font-size: clamp(48px, 7vw, 82px);
      margin-bottom: 24px;
      color: var(--white);
    }

    .hero h1 span {
      color: var(--rose);
      font-style: italic;
    }

    .hero p {
      max-width: 540px;
      margin-bottom: 29px;
      color: #f5e9e7;
      font-size: 14px;
      line-height: 1.
